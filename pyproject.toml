[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mlx-segment-ct"
version = "0.3.5"
description = "Segment CT anatomy automatically or with anatomy names and clicks, using NVIDIA VISTA-3D in native MLX"
readme = "README.md"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
keywords = [
  "mlx",
  "apple-silicon",
  "metal",
  "medical-imaging",
  "vista3d",
  "ct",
  "mri",
  "segmentation",
]
requires-python = ">=3.13,<3.14"
license = "Apache-2.0 AND BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "Joseph Sandoval" },
  { name = "Alfredo Sandoval Jr." },
]
dependencies = [
  "medmlx-core==0.2.6",
  "mlx==0.32.4; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "nibabel>=5.3,<6",
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
]

[project.urls]
Homepage = "https://medmlx.org"
Documentation = "https://github.com/MedMLX/mlx-segment-ct/blob/v0.3.5/README.md"
Repository = "https://github.com/MedMLX/mlx-segment-ct"
Issues = "https://github.com/MedMLX/mlx-segment-ct/issues"
Weights = "https://huggingface.co/models?author=MedMLX&search=vista3d"
MedMLX = "https://github.com/MedMLX/medmlx"

[project.entry-points."medmlx.models"]
mlx-segment-ct = "mlx_segment_ct.medmlx:MODEL"
mlx-segment-ctmr = "mlx_segment_ct.medmlx:CTMR_MODEL"

[project.optional-dependencies]
dev = [
  "pyright==1.1.414",
  "monai==1.6.1",
  "torch>=2.13,<3",
  "scikit-image>=0.25,<1",
  "pytest>=8.4,<10",
  "einops>=0.8,<1",
  "ruff>=0.13,<1",
  "scipy-stubs==1.18.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mlx_segment_ct"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
extend-select = ["TID251", "TID252", "ANN401"]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any" = {msg = "Use a precise type and parse untyped values at the boundary."}
"typing_extensions.Any" = {msg = "Use a precise type and parse untyped values at the boundary."}

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
constraint-dependencies = ["setuptools>=84.1.0", "filelock>=4.2.1", "Pillow>=13,<14"]

[tool.hatch.build.targets.sdist]
only-include = [
  "src/mlx_segment_ct",
  "pyproject.toml",
  "README.md",
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
]
